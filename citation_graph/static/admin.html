<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zotero RAG 管理</title>
  <link rel="stylesheet" href="/admin/assets/admin.css?v=20260902-3">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>処理状況とメンテナンス</h1>
        <p>Citation Graph · Zotero Local RAG</p>
      </div>
    </div>
    <nav aria-label="管理画面ナビゲーション"><a class="primary-link" href="/">Citation Graph</a><a href="/auth/logout">ログアウト</a></nav>
  </header>
  <main>
    <div id="notice" role="status" aria-live="polite"></div>
    <section id="freshness-section">
      <div class="section-title"><h2>更新状況</h2><span id="freshness-updated">未確認</span></div>
      <div class="freshness" id="freshness"></div>
    </section>
    <section>
      <div class="section-title"><h2>現在の状態</h2><span id="updated"></span></div>
      <div class="metrics" id="metrics"></div>
    </section>
    <section id="active-section" hidden>
      <div class="section-title"><h2>実行中</h2><span class="pulse">LIVE</span></div>
      <div id="active-job"></div>
      <pre id="active-log">ログを取得しています…</pre>
    </section>
    <section>
      <div class="section-title"><h2>処理を実行</h2><span>同時に1件まで</span></div>
      <div class="actions" id="actions"></div>
    </section>
    <section>
      <div class="section-title"><h2>実行履歴</h2><span>直近20件</span></div>
      <div class="history" id="history"></div>
    </section>
  </main>
  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title">実行確認</h2>
      <p id="confirm-description"></p>
      <label id="confirm-label">確認語を入力
        <input id="confirm-input" autocomplete="off" spellcheck="false">
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">キャンセル</button>
        <button value="confirm" id="confirm-button">実行</button>
      </div>
    </form>
  </dialog>
  <script src="/admin/assets/admin.js?v=20260902-3" defer></script>
</body>
</html>
