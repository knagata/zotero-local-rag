name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: uv sync
      - name: Compile Python sources
        run: uv run python -m compileall -q src scripts tests citation_graph
      - name: Verify the public entry point is importable
        run: uv run python -c "import src.cli"
      - name: Check fatal Python errors
        run: uv run ruff check --select E9,F63,F7,F82 src scripts tests citation_graph
      - name: Run tests
        run: uv run coverage run --source=src,citation_graph -m pytest -q -W error::RuntimeWarning -m "not slow and not corpus"
      - name: Check nothing lost its tests
        run: uv run python scripts/build_coverage_budget.py --check
