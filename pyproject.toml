[project]
name = "zotero-local-rag"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "chromadb",
    "sentence-transformers",
    "huggingface-hub>=0.34.0,<1.0",
    "pymupdf",
    "fastmcp>=3,<4",
    "httpx",
    "typing_extensions",
    "trafilatura",
    "ebooklib",
    "beautifulsoup4",
    "pydantic>=2.12,<3",
    "fa2-modified>=0.4",
    "networkx>=3.4.2",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.47.0",
    "deepl>=1.30.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "google-genai>=1.70.0",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
llm-anthropic = ["anthropic>=0.75.0"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
zotero-local-rag = "src.rag_mcp_server:main"
