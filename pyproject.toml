[project]
name = "zotero-local-rag"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "chromadb",
    "sentence-transformers",
    "huggingface-hub>=0.34.0,<1.0",
    "pymupdf",
    "fastmcp>=3,<4",
    "httpx",
    "typing_extensions",
    "trafilatura",
    "ebooklib",
    "beautifulsoup4",
    "pillow>=10,<13",
    "pydantic>=2.12,<3",
    "fa2-modified>=0.4",
    "networkx>=3.4.2",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.47.0",
    "deepl>=1.30.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.2",
    "google-genai>=1.70.0",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
llm-anthropic = ["anthropic>=0.75.0"]
pdf-docling = ["docling>=2.0,<3"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "coverage>=7,<8"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The default run excludes the marked tests. Opt in with `-m slow`; `-m ""`
# runs everything. A marker named here is the only one a test may carry --
# tests/test_default_test_selection.py refuses an undeclared one, because a
# misspelled mark is not deselected and quietly rejoins the default run.
addopts = "-m 'not slow'"
markers = [
    "slow: runs the real ingestion pipeline against the library, tens of seconds per test. CI never runs these -- they need the library, Zotero's local API, the embedding model and a locally generated baseline -- so excluding them by default removes waiting, not enforcement.",
    "corpus: needs the indexed library or a locally generated baseline, so it runs on a developer's machine and skips in CI. Excluded when measuring the coverage budget, because a floor that only one environment can reach is a floor that fails in the other one.",
]

[project.scripts]
zotero-local-rag = "src.cli:main"
